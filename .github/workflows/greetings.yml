name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Thanks for opening your first issue on py-eats! If you're asking
            about one of the challenge issues, say which number and what you've
            already tried. If you're reporting something broken in the
            baseline, include the command you ran and its output.
          pr-message: >
            Thanks for opening your first pull request — this is how
            submissions arrive, so you are in the right place. Three things
            worth knowing. **The checks grade you against this repo's copy of
            the tests, not the copy in your branch**, so editing `tests/`,
            `.github/` or the environment files will not help and will get this
            pull request closed automatically. **Run `uv run ruff check --select
            E9,F63,F7,F82 .` and `uv run pytest -m "not challenge" -q` before
            you push** — code that does not parse, or that breaks the guard
            rails, is also closed automatically, because neither can be graded.
            Everything else reaches a reviewer, including a submission that has
            not solved anything yet. And a scorecard is posted to the run
            summary for every push, saying which issues are solved and which
            are not — read that rather than guessing from the red or green
            tick. Say in the description which issues you took on, and include
            the numbers the issues asked you to report; issue #2 in particular
            ends with a question that a human reads, not a test.
