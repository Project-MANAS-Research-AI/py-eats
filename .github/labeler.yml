# labeler "full" schema — keyword labels on issue/PR title + description.

enable:
  issues: true
  prs: true

comments:
  issues: |
    Thanks for opening this issue!
    I have applied any labels matching special text in your title and description.

    Please review the labels and make any necessary changes.
  prs: |
    Thanks for the contribution!
    I have applied any labels matching special text in your title and description.

    Please review the labels and make any necessary changes.

labels:
  'bug':
    include:
      - '\bbug[s]?\b'
    exclude: []
    # Pinned to this repo's default branch. Left at master/main from a
    # template, this rule never fires on a repo that uses anything else.
    branches:
      - 'main'
  'help wanted':
    include:
      - '\bhelp( me)?\b'
    exclude:
      - '\b\[test(ing)?\]\b'
  'enhancement':
    include:
      - '\bfeat\b'
    exclude: []
