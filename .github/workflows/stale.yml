name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has had
            no activity for 60 days. It will be closed in 14 days if no further
            activity occurs. Remove the `stale` label or comment to keep it open.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has had no activity for 60 days. It will be closed in 14 days if no
            further activity occurs. Remove the `stale` label or push a commit
            to keep it open.
          # Every challenge issue carries `good first issue`. Without that
          # exemption this bot would quietly close the entire challenge after
          # 60 days of candidates not commenting — the issues ARE the product
          # here, and silence on them is normal, not abandonment.
          exempt-issue-labels: "pinned,security,good first issue"
          # Submissions are pull requests, and a candidate PR sitting quiet
          # for 60 days is a submission waiting on review, not an abandoned
          # one. Closing it out from under them would be the wrong signal.
          exempt-pr-labels: "pinned,security,submission,ready-for-review"
